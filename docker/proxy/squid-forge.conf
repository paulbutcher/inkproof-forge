# Forgejo's egress proxy: allowed-domains.txt (github.com, for mirror pushes)
# plus whatever extra/domains.txt holds. That file lives in the kit's state and
# is normally empty; scripts/migrate.sh adds api.github.com only while an
# import runs, then empties it again.
http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl extra_domains dstdomain "/etc/squid/extra/domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !SSL_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access allow extra_domains
http_access deny all

cache deny all
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 0
