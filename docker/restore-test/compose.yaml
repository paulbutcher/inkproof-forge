# scripts/restore-test.sh: a throwaway Forgejo restored from a backup, to be
# compared with the live one. Its own compose project, volume and network.
# It can reach nothing: its network is internal, so it can't push the
# backup's old refs to GitHub or send webhooks, and mirrors, webhooks and
# Actions are off besides. You can look at it on 127.0.0.1:RESTORE_TEST_PORT
# (3002) while it runs; KEEP=1 leaves it up.
name: inkproof-restore-test

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless
    networks: [restored]
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://localhost:${RESTORE_TEST_PORT:-3002}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__mirror__ENABLED: "false"
      FORGEJO__webhook__ALLOWED_HOST_LIST: "127.0.0.2"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__cron_0x2E_update_checker__ENABLED: "false"
    volumes:
      - forgejo-data:/var/lib/gitea
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60

  ports:
    build: ../ports
    command: ["socat", "TCP-LISTEN:3000,fork,reuseaddr", "TCP:forgejo:3000"]
    networks: [restored, publish]
    ports:
      - "127.0.0.1:${RESTORE_TEST_PORT:-3002}:3000"

networks:
  restored:
    internal: true
  publish: {}

volumes:
  forgejo-data:
