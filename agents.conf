# The kit's agents. One line each: name, kind, own repository (or -), and the
# repositories it files issues on: its dependencies (comma-separated; * for
# every repository listed here except its own; - for none). Every agent reads
# every repository, and has a clone of each in its workspace.
#
# Kinds:
#   coordinator         owns its repository; comments on and approves the rest
#   library             owns its repository; files issues on its dependencies
#   pr-reviewer         owns nothing; reviews pull requests everywhere
#   milestone-reviewer  owns nothing; files issues on inkproof-coordination
#
# Every library lists inkproof-coordination: requests to the coordinator and
# the upstream tracker live there.
#
# scripts/lib.sh generates each agent's service (compose.agents.yaml) from this
# file, and scripts/up.sh starts them: adding an agent here, with its role in
# roles/<name>.md, is all the kit needs.

coordinator       coordinator         inkproof-coordination      *
devtools          library             inkproof-tools             inkproof-coordination
float             library             inkproof-float             inkproof-coordination,inkproof-tools
core              library             inkproof-core              inkproof-coordination,inkproof-float,inkproof-tools
scale             library             inkproof-scale             inkproof-coordination,inkproof-core,inkproof-float,inkproof-tools
consumer-metrics  library             inkproof-consumer-metrics  inkproof-coordination,inkproof-core,inkproof-scale,inkproof-float,inkproof-tools
conformance       pr-reviewer         -                          *
architecture      milestone-reviewer  -                          *
process           milestone-reviewer  -                          *
lasm              milestone-reviewer  -                          *
