# The Inkproof forge: Forgejo, CI, egress proxies the dispatcher and the gatekeeper.
# Agents run from stage 3 (core first).
#
# Networks keep each part to what it needs:
#   agents     internal: agents, Forgejo, the dispatcher, the agents' proxy
#   ci         internal: Forgejo, the CI runner and its Docker engine, the CI proxy
#   forge-out  internal: Forgejo and its proxy, its only way out (mirror pushes)
#   forge-web  internal: Forgejo, the port forwarder and the admin tools
#   gate       internal: Forgejo and the gatekeeper, which no agent joins
#   gate-coord internal: the gatekeeper and the coordinator, which asks it for releases
#   publish    the port forwarder only, so the host can reach Forgejo on 127.0.0.1
#   egress     the three proxies, the only containers with a route out
# Forgejo is on internal networks only: whatever it sends out goes through
# forge-proxy, whose log is the record of it.

name: inkproof-forge

x-proxy: &proxy
  image: ubuntu/squid:6.6-24.04_edge
  restart: unless-stopped

# Agent containers. Each agent's image is the shared base plus its own managed
# CLAUDE.md (role, then protocol) and git rules, baked in at build.
x-agent-args: &agent-args
  USER_UID: ${HOST_UID:-501}
  USER_GID: ${HOST_GID:-20}
  FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG in .env}
  HUMAN_USER: ${HUMAN_USER:?set HUMAN_USER in .env}
  GH_OWNERS: ${GH_OWNER:?set GH_OWNER in .env} ${GH_FORMER_OWNERS:-}
  # Forgejo as the human's browser reaches it, written into the coordinator's
  # role for links to the human.
  FORGE_WEB_URL: http://localhost:${FORGE_PORT:-3000}

x-agent-build: &agent-build
  context: ./docker/agent
  target: agent
  additional_contexts:
    roles: ./roles

x-agent-env: &agent-env
  HTTPS_PROXY: http://proxy:3128
  HTTP_PROXY: http://proxy:3128
  https_proxy: http://proxy:3128
  http_proxy: http://proxy:3128
  NO_PROXY: forgejo,dispatcher,gatekeeper,localhost,127.0.0.1
  no_proxy: forgejo,dispatcher,gatekeeper,localhost,127.0.0.1
  FORGE_ORG: ${FORGE_ORG}
  HUMAN_USER: ${HUMAN_USER}
  # Whose issues and comments count; everyone else's are ignored.
  TRUSTED_AUTHORS: ${HUMAN_USER} coordinator core scale consumer-metrics conformance architecture process lasm gatekeeper dispatcher
  # How long after the human's last activity a run may start, and the
  # longest a run may last.
  HUMAN_GRACE_SECONDS: ${HUMAN_GRACE_SECONDS:-600}
  MAX_RUN_MINUTES: ${MAX_RUN_MINUTES:-240}

x-agent: &agent
  init: true
  restart: unless-stopped
  networks: [agents]
  depends_on:
    archive-init: { condition: service_completed_successfully }
    proxy: { condition: service_started }
    dispatcher: { condition: service_started }
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  working_dir: /workspace
  # CLAUDE_CODE_OAUTH_TOKEN, from secrets/claude/oauth-token (scripts/up.sh).
  env_file:
    - path: ${STATE_DIR:-.}/secrets/claude/agent.env
      required: false   # scripts/up.sh refuses to start agents without it

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless
    restart: unless-stopped
    networks: [agents, ci, forge-out, forge-web, gate]
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://localhost:${FORGE_PORT:-3000}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__server__LANDING_PAGE: login
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__FORCE_PRIVATE: "true"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__picture__DISABLE_GRAVATAR: "true"
      FORGEJO__packages__ENABLED: "false"
      FORGEJO__cron_0x2E_update_checker__ENABLED: "false"
      FORGEJO__actions__ENABLED: "true"
      # Workflows use no `uses:` actions, so nothing is fetched from outside.
      FORGEJO__actions__DEFAULT_ACTIONS_URL: self
      # Webhooks go to the dispatcher and nowhere else.
      FORGEJO__webhook__ALLOWED_HOST_LIST: dispatcher
      # The one-off migration goes through forge-proxy by Forgejo's own setting.
      FORGEJO__proxy__PROXY_ENABLED: "true"
      FORGEJO__proxy__PROXY_URL: http://forge-proxy:3128
      FORGEJO__proxy__PROXY_HOSTS: "github.com,*.github.com,*.githubusercontent.com"
      FORGEJO__migrations__ALLOWED_DOMAINS: "github.com,*.github.com,*.githubusercontent.com"
      # Push mirrors run git, which ignores that setting and reads these instead.
      HTTPS_PROXY: http://forge-proxy:3128
      https_proxy: http://forge-proxy:3128
      HTTP_PROXY: http://forge-proxy:3128
      http_proxy: http://forge-proxy:3128
      NO_PROXY: dispatcher,forgejo,localhost,127.0.0.1
      no_proxy: dispatcher,forgejo,localhost,127.0.0.1
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Forwards 127.0.0.1:FORGE_PORT on the host to Forgejo, and
  # 127.0.0.1:DISPATCHER_PORT to the dispatcher's status, so neither needs a
  # network with a route out.
  ports:
    build: ./docker/ports
    restart: unless-stopped
    command: ["sh", "-c", "socat TCP-LISTEN:3001,fork,reuseaddr TCP:dispatcher:8080 & exec socat TCP-LISTEN:3000,fork,reuseaddr TCP:forgejo:3000"]
    networks: [publish, forge-web]
    ports:
      - "127.0.0.1:${FORGE_PORT:-3000}:3000"
      - "127.0.0.1:${DISPATCHER_PORT:-3001}:3001"

  # Egress for agents.
  proxy:
    <<: *proxy
    networks: [agents, egress]
    volumes:
      - ./docker/proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/proxy/allow-agents.txt:/etc/squid/allowed-domains.txt:ro
      - proxy-logs:/var/log/squid

  # Egress for CI jobs.
  ci-proxy:
    <<: *proxy
    networks: [ci, egress]
    volumes:
      - ./docker/proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/proxy/allow-ci.txt:/etc/squid/allowed-domains.txt:ro
      - ci-proxy-logs:/var/log/squid

  # Egress for Forgejo: mirror pushes to GitHub, nothing else.
  forge-proxy:
    <<: *proxy
    networks: [forge-out, egress]
    volumes:
      - ./docker/proxy/squid-forge.conf:/etc/squid/squid.conf:ro
      - ${STATE_DIR:-.}/proxy:/etc/squid/extra:ro
      - ./docker/proxy/allow-forge.txt:/etc/squid/allowed-domains.txt:ro
      - forge-proxy-logs:/var/log/squid

  # CI jobs run in this engine, never in the host's. It is privileged, so
  # jobs must not reach its API: it listens only with TLS, and only the
  # runner holds the client certificate.
  ci-docker:
    image: docker:29.9.3-dind
    restart: unless-stopped
    privileged: true
    hostname: ci-docker
    networks: [ci]
    environment:
      DOCKER_TLS_CERTDIR: /certs
      HTTP_PROXY: http://ci-proxy:3128
      HTTPS_PROXY: http://ci-proxy:3128
      NO_PROXY: forgejo,localhost,127.0.0.1
    volumes:
      - ci-docker-data:/var/lib/docker
      - ci-certs:/certs/client

  ci-runner:
    image: code.forgejo.org/forgejo/runner:13.2.1
    restart: unless-stopped
    depends_on: [ci-docker, forgejo]
    networks: [ci]
    working_dir: /data
    entrypoint: ["sh", "/etc/runner/entry.sh"]
    environment:
      DOCKER_HOST: tcp://ci-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - ./docker/ci/config.yml:/etc/runner/config.yml:ro
      - ./docker/ci/entry.sh:/etc/runner/entry.sh:ro
      - ${STATE_DIR:-.}/secrets/ci:/run/ci:ro
      - ci-certs:/certs/client:ro
      - ci-runner-data:/data

  # Receives Forgejo's webhooks. From stage 4 it also queues work for agents.
  # It also queues work for agents, hands it to their runners, and keeps the
  # run ledger. Its status is on the host at 127.0.0.1:DISPATCHER_PORT.
  dispatcher:
    build: ./docker/dispatcher
    restart: unless-stopped
    networks: [agents, forge-web]
    environment:
      FORGE_URL: http://forgejo:3000
      FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG in .env}
      HUMAN_USER: ${HUMAN_USER:?set HUMAN_USER in .env}
      MAX_RUNS_PER_DAY: ${MAX_RUNS_PER_DAY:-20}
      DEBOUNCE_SECONDS: ${DEBOUNCE_SECONDS:-60}
      MAX_DELAY_SECONDS: ${MAX_DELAY_SECONDS:-900}
      MAX_SPEND_PER_DAY: ${MAX_SPEND_PER_DAY:-0}
      RECONCILE_SECONDS: ${RECONCILE_SECONDS:-900}
      IDLE_SECONDS: ${IDLE_SECONDS:-1200}
      UNVERIFIED_NUDGE_SECONDS: ${UNVERIFIED_NUDGE_SECONDS:-86400}
      UNVERIFIED_STALL_SECONDS: ${UNVERIFIED_STALL_SECONDS:-172800}
      CONFORMANCE_SETTLE_SECONDS: ${CONFORMANCE_SETTLE_SECONDS:-600}
      REPO_PREFIX: ${REPO_PREFIX:-inkproof-}
    volumes:
      # webhook-secret, and token once scripts/bootstrap.sh has made it.
      - ${STATE_DIR:-.}/secrets/dispatcher:/run/secrets/dispatcher:ro
      - ${STATE_DIR:-.}/secrets/runner-keys:/run/secrets/runner-keys:ro
      - ${STATE_DIR:-.}/control:/control:ro
      - ./agents.conf:/etc/kit/agents.conf:ro
      - dispatcher-state:/state

  # Approves a pull request once the Actions run for its head commit succeeded,
  # at autonomy levels 2 and 3, and releases at level 3 when the coordinator
  # asks (docker/gatekeeper/gatekeeper.py). It shares a network with Forgejo,
  # and another with the coordinator only; its token is mounted nowhere else.
  gatekeeper:
    build: ./docker/gatekeeper
    restart: unless-stopped
    networks: [gate, gate-coord]
    depends_on: [forgejo]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FORGE_URL: http://forgejo:3000
      FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG in .env}
      GATEKEEPER_POLL_SECONDS: ${GATEKEEPER_POLL_SECONDS:-30}
    volumes:
      - ${STATE_DIR:-.}/secrets/gatekeeper:/run/secrets/gatekeeper:ro
      - ${STATE_DIR:-.}/control:/control:ro

  # Creates each agent's folder in the run archive, owned by the agent's user,
  # before any agent starts; each agent mounts only its own folder.
  archive-init:
    image: alpine:3.24
    network_mode: none
    entrypoint: ["sh", "-c", "for a in coordinator core scale consumer-metrics conformance architecture process lasm; do mkdir -p /archive/$$a; chown ${HOST_UID:-501}:${HOST_GID:-20} /archive/$$a; done"]
    volumes:
      - run-archive:/archive

  # --- Agents -------------------------------------------------------------------
  # One service per agent, from the x-agent template below. Each sees only its
  # own Forgejo token and runner key, its own workspace and Claude
  # configuration, and its own folder in the run archive.
  coordinator:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: coordinator
        AGENT_REPO: inkproof-coordination
    image: inkproof-agent-coordinator:1
    hostname: coordinator
    # It alone shares a network with the gatekeeper, which it asks for releases.
    networks: [agents, gate-coord]
    environment:
      <<: *agent-env
      AGENT_NAME: coordinator
      AGENT_REPO: inkproof-coordination
      AGENT_READS: inkproof-core,inkproof-scale,inkproof-consumer-metrics
      GIT_AUTHOR_NAME: coordinator
      GIT_AUTHOR_EMAIL: coordinator@noreply.localhost
      GIT_COMMITTER_NAME: coordinator
      GIT_COMMITTER_EMAIL: coordinator@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/coordinator/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/coordinator:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/secrets/gatekeeper/coordinator-key:/run/secrets/gatekeeper_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-coordinator:/workspace
      - claude-coordinator:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: coordinator }

  core:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: core
        AGENT_REPO: inkproof-core
    image: inkproof-agent-core:1
    hostname: core
    environment:
      <<: *agent-env
      AGENT_NAME: core
      AGENT_REPO: inkproof-core
      AGENT_READS: inkproof-coordination
      GIT_AUTHOR_NAME: core
      GIT_AUTHOR_EMAIL: core@noreply.localhost
      GIT_COMMITTER_NAME: core
      GIT_COMMITTER_EMAIL: core@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/core/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/core:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-core:/workspace
      - claude-core:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: core }

  scale:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: scale
        AGENT_REPO: inkproof-scale
    image: inkproof-agent-scale:1
    hostname: scale
    environment:
      <<: *agent-env
      AGENT_NAME: scale
      AGENT_REPO: inkproof-scale
      AGENT_READS: inkproof-coordination,inkproof-core
      GIT_AUTHOR_NAME: scale
      GIT_AUTHOR_EMAIL: scale@noreply.localhost
      GIT_COMMITTER_NAME: scale
      GIT_COMMITTER_EMAIL: scale@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/scale/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/scale:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-scale:/workspace
      - claude-scale:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: scale }

  consumer-metrics:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: consumer-metrics
        AGENT_REPO: inkproof-consumer-metrics
    image: inkproof-agent-consumer-metrics:1
    hostname: consumer-metrics
    environment:
      <<: *agent-env
      AGENT_NAME: consumer-metrics
      AGENT_REPO: inkproof-consumer-metrics
      AGENT_READS: inkproof-coordination,inkproof-core,inkproof-scale
      GIT_AUTHOR_NAME: consumer-metrics
      GIT_AUTHOR_EMAIL: consumer-metrics@noreply.localhost
      GIT_COMMITTER_NAME: consumer-metrics
      GIT_COMMITTER_EMAIL: consumer-metrics@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/consumer-metrics/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/consumer-metrics:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-consumer-metrics:/workspace
      - claude-consumer-metrics:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: consumer-metrics }

  # Reviewers own no repository; each reads them all.
  conformance:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: conformance
        AGENT_REPO: "-"
    image: inkproof-agent-conformance:1
    hostname: conformance
    environment:
      <<: *agent-env
      AGENT_NAME: conformance
      AGENT_REPO: ""
      AGENT_WORKSPACE: /workspace/conformance
      AGENT_READS: inkproof-coordination,inkproof-core,inkproof-scale,inkproof-consumer-metrics
      CONFORMANCE_ROUNDS: ${CONFORMANCE_ROUNDS:-3}
      GIT_AUTHOR_NAME: conformance
      GIT_AUTHOR_EMAIL: conformance@noreply.localhost
      GIT_COMMITTER_NAME: conformance
      GIT_COMMITTER_EMAIL: conformance@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/conformance/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/conformance:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-conformance:/workspace
      - claude-conformance:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: conformance }

  architecture:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: architecture
        AGENT_REPO: "-"
    image: inkproof-agent-architecture:1
    hostname: architecture
    environment:
      <<: *agent-env
      AGENT_NAME: architecture
      AGENT_REPO: ""
      AGENT_WORKSPACE: /workspace/architecture
      AGENT_READS: inkproof-coordination,inkproof-core,inkproof-scale,inkproof-consumer-metrics
      CONFORMANCE_ROUNDS: ${CONFORMANCE_ROUNDS:-3}
      GIT_AUTHOR_NAME: architecture
      GIT_AUTHOR_EMAIL: architecture@noreply.localhost
      GIT_COMMITTER_NAME: architecture
      GIT_COMMITTER_EMAIL: architecture@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/architecture/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/architecture:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-architecture:/workspace
      - claude-architecture:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: architecture }

  process:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: process
        AGENT_REPO: "-"
    image: inkproof-agent-process:1
    hostname: process
    environment:
      <<: *agent-env
      AGENT_NAME: process
      AGENT_REPO: ""
      AGENT_WORKSPACE: /workspace/process
      AGENT_READS: inkproof-coordination,inkproof-core,inkproof-scale,inkproof-consumer-metrics
      CONFORMANCE_ROUNDS: ${CONFORMANCE_ROUNDS:-3}
      GIT_AUTHOR_NAME: process
      GIT_AUTHOR_EMAIL: process@noreply.localhost
      GIT_COMMITTER_NAME: process
      GIT_COMMITTER_EMAIL: process@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/process/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/process:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-process:/workspace
      - claude-process:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: process }
      # Every agent's runs and the human's sessions, for the process review.
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive-all
        read_only: true

  lasm:
    <<: *agent
    build:
      <<: *agent-build
      args:
        <<: *agent-args
        AGENT: lasm
        AGENT_REPO: "-"
    image: inkproof-agent-lasm:1
    hostname: lasm
    environment:
      <<: *agent-env
      AGENT_NAME: lasm
      AGENT_REPO: ""
      AGENT_WORKSPACE: /workspace/lasm
      AGENT_READS: inkproof-coordination,inkproof-core,inkproof-scale,inkproof-consumer-metrics
      CONFORMANCE_ROUNDS: ${CONFORMANCE_ROUNDS:-3}
      GIT_AUTHOR_NAME: lasm
      GIT_AUTHOR_EMAIL: lasm@noreply.localhost
      GIT_COMMITTER_NAME: lasm
      GIT_COMMITTER_EMAIL: lasm@noreply.localhost
    volumes:
      - ${STATE_DIR:-.}/secrets/lasm/token:/run/secrets/forgejo_token:ro
      - ${STATE_DIR:-.}/secrets/runner-keys/lasm:/run/secrets/runner_key:ro
      - ${STATE_DIR:-.}/control:/etc/inkproof/control:ro
      - work-lasm:/workspace
      - claude-lasm:/home/agent/.claude
      - agent-elan:/home/agent/.elan
      - type: volume
        source: run-archive
        target: /var/lib/inkproof/archive
        volume: { subpath: lasm }

  # The image CI jobs run in. Built here and loaded into ci-docker by
  # scripts/up.sh, so the CI engine never pulls from a registry.
  ci-image:
    build: ./docker/ci/image
    image: inkproof-ci:1
    profiles: [build]

  # Admin tasks against Forgejo's API (bootstrap, tests), with known bash and
  # jq versions rather than the host's. Writes secrets/ as the host user.
  tools:
    build: ./docker/tools
    profiles: [tools]
    user: "${HOST_UID:-501}:${HOST_GID:-20}"
    networks: [forge-web]
    environment:
      FORGE_URL: http://forgejo:3000
      GH_OWNER: ${GH_OWNER:?set GH_OWNER in .env}
      GH_FORMER_OWNERS: ${GH_FORMER_OWNERS:-}
      FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG in .env}
      REPO_PREFIX: ${REPO_PREFIX:-inkproof-}
      HUMAN_USER: ${HUMAN_USER:?set HUMAN_USER in .env}
      MIRROR_BRANCHES: ${MIRROR_BRANCHES-main}
      KEEP: ${KEEP:-}
    volumes:
      - ${STATE_DIR:-.}/secrets:/secrets
      - ${STATE_DIR:-.}/control:/control
      # Tests read a copy of Forgejo's database for what its API leaves out,
      # such as the GitHub author of migrated content.
      - forgejo-data:/forgejo:ro
      - ./agents.conf:/etc/kit/agents.conf:ro
      - ./templates:/etc/kit/templates:ro
      - ./tests:/etc/kit/tests:ro

  # Stands in for an agent container in network tests: same network and
  # proxy settings, nothing else.
  probe:
    build: ./docker/tools
    profiles: [tools]
    networks: [agents]
    entrypoint: ["sleep", "infinity"]
    environment:
      HTTPS_PROXY: http://proxy:3128
      HTTP_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      http_proxy: http://proxy:3128
      NO_PROXY: forgejo,dispatcher,localhost,127.0.0.1
      no_proxy: forgejo,dispatcher,localhost,127.0.0.1

networks:
  agents:
    internal: true
  ci:
    internal: true
  forge-out:
    internal: true
  forge-web:
    internal: true
  gate:
    internal: true
  gate-coord:
    internal: true
  publish: {}
  egress: {}

volumes:
  forgejo-data:
  forgejo-config:
  proxy-logs:
  ci-proxy-logs:
  forge-proxy-logs:
  ci-docker-data:
  ci-certs:
  ci-runner-data:
